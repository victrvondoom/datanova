[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-fraud-x"
version = "0.1.0"
description = "AEGIS-Fraud X: Adaptive Graph-Enhanced Intelligence for Explainable, Cost-Aware Financial Fraud Prevention"
authors = [{ name = "AEGIS-Fraud X Research Team", email = "research@aegis-fraud-x.local" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "scikit-learn>=1.8.0",
    "lightgbm>=4.6.0",
    "xgboost>=3.4.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "networkx>=3.4.0",
    "shap>=0.54.0",
    "python-pptx>=1.0.0",
    "python-dotenv>=1.2.2",  # PYSEC-2026-2270 remediation floor
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.17.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = [".", "packages", "apps/api"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["reports", "BENCHMARKS.md", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
namespace_packages = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
